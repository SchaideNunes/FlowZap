services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Interno para a Evolution API (Leve, ~20MB RAM)
  # ----------------------------------------------------------------------------
  evolution-postgres:
    image: postgres:15-alpine
    container_name: flowzap_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_secret_2026
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  # ----------------------------------------------------------------------------
  # Redis para Cache de Sessão e Baileys da Evolution API (~5MB RAM)
  # ----------------------------------------------------------------------------
  evolution-redis:
    image: redis:7-alpine
    container_name: flowzap_evolution_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data

  # ----------------------------------------------------------------------------
  # Evolution API v2 - Gateway WhatsApp Multi-Device (QR Code)
  # ----------------------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: flowzap_evolution_api
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - SERVER_URL=http://localhost:8085
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-flowzap_super_secret_evolution_key_2026}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_secret_2026@evolution-postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_flowzap
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
    depends_on:
      - evolution-postgres
      - evolution-redis
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

  # ----------------------------------------------------------------------------
  # FlowZap Backend (Node.js + Express API + Scheduler)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowzap_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-flowzap_super_secret_evolution_key_2026}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-flowzap_cobranca}
      - MIN_DELAY_SECONDS=${MIN_DELAY_SECONDS:-8}
      - MAX_DELAY_SECONDS=${MAX_DELAY_SECONDS:-20}
      - SIMULATE_TYPING=${SIMULATE_TYPING:-true}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 9 * * *}
    depends_on:
      - evolution-api

volumes:
  evolution_instances:
    driver: local
  evolution_store:
    driver: local
  evolution_postgres_data:
    driver: local
  evolution_redis_data:
    driver: local
